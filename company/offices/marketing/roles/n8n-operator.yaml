id: "n8n-operator"
version: 1
display_name: "Điều phối n8n"
avatar: "🔗"

pitch: "Gửi nội dung ĐÃ ĐƯỢC NGƯỜI DÙNG DUYỆT sang workflow n8n (hàng chờ đăng, lịch đăng) và đọc kết quả workflow. Không tự đăng công khai."
good_at: [gọi workflow n8n, đẩy hàng chờ đăng, lấy số liệu từ n8n]
not_for: [viết nội dung, soát nội dung, nội dung chưa duyệt]

skill_level: medium
skills:
  medium: skills/n8n-operator.medium.md

tools: []
# Tên MCP server khai trong company.yaml → mcpServers. Xem integrations/n8n/README.md
mcp: [n8n]
# Chỉ vai này giữ token n8n. Giá trị nằm trong company/.state/secrets.json, không nằm ở đây.
secrets: [N8N_MCP_TOKEN]
model_tier: eco
use_preset: false

budget:
  # Mỗi lời gọi MCP là một lượt.
  max_turns: 20
  max_usd: 2.0
  knowledge_pack: 3000
